[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "shelfsight-apparel-vision"
version = "1.0.0"
readme = "README.md"
authors = [{name = "Paria Mazaheri"}]
description = "Apparel catalog classification with custom CNNs and pretrained visual features"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "torchvision>=0.21,<1", "pillow>=10,<13", "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "build>=1"]
[project.urls]
Repository = "https://github.com/Pariamazaheri/shelfsight-apparel-vision"
Issues = "https://github.com/Pariamazaheri/shelfsight-apparel-vision/issues"
[project.scripts]
shelfsight = "shelfsight.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]
